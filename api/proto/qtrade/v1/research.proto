syntax = "proto3";

package qtrade.v1;

option go_package = "github.com/qtrade/qtrade/gen/go/qtrade/v1;qtradev1";

import "google/protobuf/timestamp.proto";

message Strategy {
  string id = 1;
  string name = 2;
  string description = 3;
  string status = 4;
  google.protobuf.Timestamp created_at = 5;
}

message StrategyVersion {
  string id = 1;
  string strategy_id = 2;
  string version = 3;
  string artifact_digest = 4;
  string python_version = 5;
  google.protobuf.Timestamp created_at = 6;
}

message BacktestRequest {
  string strategy_id = 1;
  string strategy_version = 2;
  string data_snapshot_id = 3;
  string start_date = 4;
  string end_date = 5;
  int64 initial_cash_cents = 6;
  string benchmark = 7;
  string universe = 8;
  string frequency = 9;
  map<string, string> params = 10;
}

message BacktestRun {
  string id = 1;
  string strategy_id = 2;
  string strategy_version = 3;
  string data_snapshot_id = 4;
  string status = 5;
  map<string, double> metrics = 6;
  google.protobuf.Timestamp created_at = 7;
}

message GetBacktestRequest {
  string id = 1;
}

message LiveDeployment {
  string id = 1;
  string strategy_id = 2;
  string strategy_version = 3;
  string mode = 4;
  string account_id = 5;
  string status = 6;
  google.protobuf.Timestamp created_at = 7;
}

service ResearchService {
  rpc SubmitBacktest(BacktestRequest) returns (BacktestRun);
  rpc GetBacktest(GetBacktestRequest) returns (BacktestRun);
}
