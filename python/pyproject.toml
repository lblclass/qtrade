[project]
name = "qtrade-research"
version = "0.1.0"
description = "Research, strategy API and event-driven backtest engine for qtrade"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
data = ["polars>=1.0", "pyarrow>=17.0"]
research = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.14"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
qtrade-demo = "qtrade_research.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtrade_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

