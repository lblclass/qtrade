[project]
name = "qtrade-research"
version = "0.2.0"
description = "Research, strategy API, market data collection and event-driven backtests for qtrade"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
data = ["pyarrow>=17.0"]
baostock = ["baostock>=0.9", "pandas>=2.2"]
postgres = ["psycopg[binary]>=3.2"]
research = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.14"]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
qtrade-demo = "qtrade_research.cli:main"
qtrade-data = "qtrade_research.data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtrade_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"